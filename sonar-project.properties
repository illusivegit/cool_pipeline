# SonarQube project configuration
# Scanner reads this automatically from the project root.

sonar.projectKey=Docker-CICD
sonar.projectName=Docker-CICD

# Source directories to scan
sonar.sources=backend,frontend,lib,scripts
sonar.sourceEncoding=UTF-8

# Python-specific settings (Flask backend)
sonar.python.version=3.11

# Exclusions — generated files, vendored deps, test fixtures
sonar.exclusions=\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/data/**,\
  **/backups/**,\
  **/artifacts/**,\
  **/*.min.js,\
  **/grafana/dashboards/**

# Coverage report path (when pytest-cov is wired up)
# sonar.python.coverage.reportPaths=coverage.xml
