# ============================================================================
# Pre-commit hooks — Gate 1: Developer workstation (<10s)
# ============================================================================
#
# Install:  pre-commit install
# Run all:  pre-commit run --all-files
# Skip:     git commit --no-verify  (escape hatch — CI will still catch it)
#
# Philosophy: Only fast, auto-fixable checks that catch issues before they
# waste CI time. No SAST, no SCA, no runtime tests — that's CI's job.
# ============================================================================

repos:
  # ── Hygiene ──────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: '\.yml\.tmpl$'
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key

  # ── Secret scanning ─────────────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  # ── Shell linting ────────────────────────────────────────────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [-x, -P, SCRIPTDIR]
        files: \.(sh|bash)$

  # ── Python linting (ruff — replaces flake8 + isort + pycodestyle) ──────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.11
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # ── Dockerfile linting ──────────────────────────────────────────────────
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
